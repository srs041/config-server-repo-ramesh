# Enable health endpoints
management.health.circuitbreakers.enabled=true
management.endpoint.health.show-details=always
management.endpoints.web.exposure.include=*

# Circuit Breaker Config for "employee-service" instance
spring.cloud.circuitbreaker.resilience4j.instances.employee-service.failure-rate-threshold=50
spring.cloud.circuitbreaker.resilience4j.instances.employee-service.minimum-number-of-calls=5
spring.cloud.circuitbreaker.resilience4j.instances.employee-service.automatic-transition-from-open-to-half-open-enabled=true
spring.cloud.circuitbreaker.resilience4j.instances.employee-service.wait-duration-in-open-state=5s
spring.cloud.circuitbreaker.resilience4j.instances.employee-service.permitted-number-of-calls-in-half-open-state=3
spring.cloud.circuitbreaker.resilience4j.instances.employee-service.sliding-window-size=10
spring.cloud.circuitbreaker.resilience4j.instances.employee-service.sliding-window-type=COUNT_BASED
